<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>...</title>
<style>
html,body{margin:0;height:100%;background:#0b0c1a;color:#fff;font-family:system-ui,Tahoma,Arial,sans-serif}
body{display:grid;place-items:center;text-align:center}
.s{width:42px;height:42px;border:4px solid #ffffff30;border-top-color:#7c5cff;border-radius:50%;animation:r 1s linear infinite;margin:0 auto 14px}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div><div class="s"></div><div id="m">جارٍ التحميل...</div></div>
<script>
(async () => {
  // يُستبدل هذا الرابط تلقائياً أثناء البناء برابط GitHub Pages الخاص بك
  const BASE = "__REMOTE_BASE__";
  const K_HTML = "__remote_html", K_VER = "__remote_ver";

  const timeout = (p, ms) => Promise.race([
    p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))
  ]);

  function show(html, title) {
    document.open();
    document.write(html);
    document.close();
    if (title) setTimeout(() => { document.title = title; }, 0);
  }

  // 1) المحاولة من الإنترنت (آخر نسخة)
  try {
    const cfg = await timeout(
      fetch(BASE + "config.json?_=" + Date.now(), { cache: "no-store" }).then(r => {
        if (!r.ok) throw new Error("cfg"); return r.json();
      }), 5000);

    if (cfg.maintenance) {
      document.getElementById("m").textContent = cfg.maintenance;
      return;
    }

    let html = localStorage.getItem(K_HTML);
    if (!html || localStorage.getItem(K_VER) !== String(cfg.version)) {
      html = await timeout(
        fetch(BASE + (cfg.entry || "app.html") + "?v=" + encodeURIComponent(cfg.version), { cache: "no-store" })
          .then(r => { if (!r.ok) throw new Error("html"); return r.text(); }), 15000);
      try { localStorage.setItem(K_HTML, html); localStorage.setItem(K_VER, String(cfg.version)); } catch (e) {}
    }
    return show(html, cfg.title);
  } catch (e) {}

  // 2) بدون إنترنت: آخر نسخة محفوظة
  const cached = localStorage.getItem(K_HTML);
  if (cached) return show(cached);

  // 3) النسخة المضمّنة داخل التطبيق
  try {
    const html = await fetch("game.html").then(r => r.text());
    show(html);
  } catch (e) {
    document.getElementById("m").textContent = "تعذّر تحميل التطبيق";
  }
})();
</script>
</body>
</html>
